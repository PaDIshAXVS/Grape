<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ sort }}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161d;
            --text-main: #ffffff;
            --text-muted: #8b8c9a;
            --accent-color: #00ffcc; 
            --secondary-accent: #cba6f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px;
            user-select: none; -webkit-user-select: none;
            padding-bottom: 50px;
        }

        .nav-header { display: flex; align-items: center; margin-bottom: 25px; gap: 15px; }
        .back-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main); width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer;
        }

        .grape-title { font-size: 22px; font-weight: 700; }

        .section-title { font-size: 14px; margin: 20px 0 10px 0; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .form-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.02);
            padding: 20px; border-radius: 16px; display: flex; flex-direction: column; gap: 16px;
            margin-bottom: 25px;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        
        .form-input {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255, 255, 255, 0.08); 
            color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 15px; outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: var(--accent-color); }

        textarea.form-input { resize: none; height: 80px; font-family: inherit; }

        /* Фотогалерея строго 3 колонки */
        .gallery-container { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            margin-bottom: 25px; 
        }
        
        .gallery-item, .upload-box {
            width: 100%;
            aspect-ratio: 1 / 1; 
            border-radius: 10px; 
            overflow: hidden; 
        }

        .gallery-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05); 
            position: relative;
        }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

        .upload-box {
            border: 2px dashed rgba(255,255,255,0.15);
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            color: var(--text-muted); 
            font-size: 12px; 
            font-weight: 500;
            background: rgba(255,255,255,0.01);
            transition: border-color 0.2s, color 0.2s;
        }
        .upload-box:active { border-color: var(--accent-color); color: var(--accent-color); }
        .upload-box svg { width: 24px; height: 24px; margin-bottom: 4px; }
        #fileInput { display: none; }

        .save-btn {
            background: var(--accent-color); color: #000; border: none; width: 100%;
            padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s; margin-top: 10px;
        }
        .save-btn:active { transform: scale(0.98); }

        .delete-btn {
            background: rgba(255, 60, 60, 0.05); color: #ff4d4d; border: 1px solid rgba(255, 60, 60, 0.15);
            width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer;
            margin-top: 30px; transition: all 0.2s;
        }
        .delete-btn:active { background: rgba(255, 60, 60, 0.15); transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="nav-header">
        <button class="back-btn" onclick="window.location.href='/user/{{ telegram_id }}'">←</button>
        <div class="grape-title">{{ sort }}</div>
    </div>

    <div class="section-title">Информация о кусте</div>

    <div class="form-card">
        <div class="form-group">
            <label class="form-label">Сорт</label>
            <input type="text" id="grapeSort" class="form-input" value="{{ sort }}">
        </div>

        <div class="form-group">
            <label class="form-label">Место посадки (ряд, место)</label>
            <input type="text" id="grapeLocation" class="form-input" value="{{ location or '' }}" placeholder="Например: Ряд 2, Куст 4">
        </div>

        <div class="form-group">
            <label class="form-label">Дата посадки</label>
            <!-- Изменен тип инпута на month для выбора только месяца и года -->
            <input type="month" id="grapeDate" class="form-input">
        </div>

        <div class="form-group">
            <label class="form-label">Описание сорта</label>
            <textarea id="grapeSortText" class="form-input" placeholder="Особенности сорта, вкусовые качества... ">{{ sort_text or '' }}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label">Сахаристость (Брикс, %)</label>
            <input type="number" step="0.1" id="grapeBriks" class="form-input" value="{{ briks }}" placeholder="Например: 18.5">
        </div>

        <div class="form-group">
            <label class="form-label">Суммарный урожай (кг)</label>
            <input type="number" step="0.1" id="grapeTotal" class="form-input" value="{{ total }}">
        </div>
    </div>

    <div class="section-title">Фотографии</div>

    <div class="gallery-container">
        {% for image in images %}
        <div class="gallery-item" onclick="window.location.href='/user/{{ telegram_id }}/grape/{{ id }}/image/{{ image.id }}'">
            <img src="{{ image.file_path }}" alt="Фото винограда">
        </div>
        {% endfor %}
        
        <label class="upload-box" for="fileInput">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
            Добавить
        </label>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="uploadPhoto(this)">
    </div>

    <button class="save-btn" onclick="saveChanges()">Сохранить изменения</button>
    <button class="delete-btn" onclick="deleteGrape()">Удалить этот куст</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Безопасное заполнение инпута выбора месяца (формат YYYY-MM)
        const rawDate = "{{ date }}"; 
        if (rawDate && rawDate !== "None") {
            const d = new Date(rawDate.replace(' ', 'T'));
            if (!isNaN(d)) {
                // Извлекаем только год и месяц
                const formatted = d.toISOString().split('T')[0].substring(0, 7);
                document.getElementById('grapeDate').value = formatted;
            }
        }

        // Сохранение текстовых изменений
        async function saveChanges() {
            const sort = document.getElementById('grapeSort').value.trim();
            const location = document.getElementById('grapeLocation').value.trim();
            const sortText = document.getElementById('grapeSortText').value.trim();
            const dateVal = document.getElementById('grapeDate').value;
            const briks = parseFloat(document.getElementById('grapeBriks').value) || 0.0;
            const total = parseFloat(document.getElementById('grapeTotal').value) || 0.0;

            if (!sort) {
                tg.showAlert("Название сорта не может быть пустым!");
                return;
            }

            const payload = {
                location: location,
                sort_text: sortText,
                briks: briks,
                total: total
            };

            if (dateVal) {
                // Принудительно ставим 1-е число месяца для корректной записи в бэкенд
                payload.date = new Date(dateVal + "-01").toISOString();
            }

            try {
                const response = await fetch(`/user/{{ telegram_id }}/grape/{{ id }}/update`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    tg.showAlert("Изменения успешно сохранены!");
                    window.location.href = '/user/{{ telegram_id }}';
                } else {
                    tg.showAlert("Не удалось сохранить изменения.");
                }
            } catch (e) {
                console.error(e);
                tg.showAlert("Ошибка соединения с сервером.");
            }
        }

        // Асинхронная загрузка одной или нескольких фотографий
        async function uploadPhoto(input) {
            if (!input.files || input.files.length === 0) return;

            tg.MainButton.setText("Загрузка фотографий...");
            tg.MainButton.show();

            for (let i = 0; i < input.files.length; i++) {
                const file = input.files[i];
                const formData = new FormData();
                formData.append("file", file);

                try {
                    const response = await fetch(`/user/{{ telegram_id }}/grape/{{ id }}/upload_image`, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        tg.showAlert(`Ошибка при загрузке ${file.name}: ${errData.detail || 'ошибка сервера'}`);
                    }
                } catch (e) {
                    console.error("Ошибка отправки:", e);
                    tg.showAlert(`Ошибка сети при загрузке файла ${file.name}`);
                }
            }

            tg.MainButton.hide();
            window.location.reload();
        }

        // Удаление куста
        function deleteGrape() {
            tg.showConfirm("Вы действительно хотите удалить этот куст винограда из базы данных?", async function(confirmed) {
                if (confirmed) {
                    try {
                        const response = await fetch(`/user/{{ telegram_id }}/grape/{{ id }}`, {
                            method: 'DELETE'
                        });
                        if (response.ok) {
                            window.location.href = '/user/{{ telegram_id }}';
                        } else {
                            tg.showAlert("Ошибка удаления.");
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }
            });
        }
    </script>
</body>
</html>
