<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Просмотр фото</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161d;
            --text-main: #ffffff;
            --text-muted: #8b8c9a;
            --accent-color: #00ffcc; 
            --secondary-accent: #cba6f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px;
            user-select: none; -webkit-user-select: none;
            padding-bottom: 50px;
        }

        .nav-header { display: flex; align-items: center; margin-bottom: 25px; gap: 15px; }
        .back-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main); width: 40px; height: 40px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer;
        }

        .image-title { font-size: 20px; font-weight: 700; }

        .image-container {
            width: 100%; max-height: 70vh; border-radius: 16px; overflow: hidden;
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.03);
            display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
        }
        .image-container img {
            width: 100%; height: auto; max-height: 70vh; object-fit: contain;
        }

        .section-title { font-size: 14px; margin: 15px 0 10px 0; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .form-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.02);
            padding: 18px; border-radius: 16px; display: flex; flex-direction: column; gap: 14px;
            margin-bottom: 20px;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        
        .form-input {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255, 255, 255, 0.08); 
            color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 15px; outline: none;
            transition: border-color 0.2s; resize: none; height: 80px; font-family: inherit;
        }
        .form-input:focus { border-color: var(--accent-color); }

        .save-btn {
            background: var(--accent-color); color: #000; border: none; width: 100%;
            padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s;
        }
        .save-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="nav-header">
        <!-- Кнопка назад вернет папу на детальную страницу конкретного куста винограда -->
        <button class="back-btn" onclick="window.location.href='/user/{{ telegram_id }}/grape/{{ grape_id }}'">←</button>
        <div class="image-title">Просмотр фото</div>
    </div>

    <div class="image-container">
        <img src="{{ file_path }}" alt="Детальный просмотр">
    </div>

    <div class="section-title">Описание к этой фотографии</div>

    <div class="form-card">
        <div class="form-group">
            <textarea id="imageDescription" class="form-input" placeholder="Например: Появились первые завязи, Состояние листьев хорошее...">{{ description or '' }}</textarea>
        </div>
    </div>

    <button class="save-btn" onclick="saveDescription()">Сохранить описание</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        async function saveDescription() {
            const descriptionText = document.getElementById('imageDescription').value.trim();

            const payload = {
                text: descriptionText
            };

            try {
                // Отправляем POST-запрос на ваш эндпоинт обновления описания
                const response = await fetch(`/user/{{ telegram_id }}/grape/{{ grape_id }}/image/{{ id }}/description`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    tg.showAlert("Описание успешно сохранено!");
                } else {
                    tg.showAlert("Не удалось сохранить описание.");
                }
            } catch (e) {
                console.error(e);
                tg.showAlert("Ошибка соединения с сервером.");
            }
        }
    </script>
</body>
</html>
