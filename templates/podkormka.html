<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Журнал подкормок</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161d;
            --text-main: #ffffff;
            --text-muted: #8b8c9a;
            --accent-color: #00ffcc; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px 20px 80px 20px; /* Отступ под навигацию */
            user-select: none; -webkit-user-select: none;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 { font-size: 24px; font-weight: 700; }
        .stats-badge {
            background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px;
            font-size: 14px; color: var(--text-muted); border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title { font-size: 14px; margin: 20px 0 10px 0; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .log-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        
        .log-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 16px; border-radius: 14px; display: flex; align-items: flex-start; justify-content: space-between;
            gap: 15px; animation: slideUp 0.4s forwards;
        }

        .log-details { display: flex; flex-direction: column; gap: 6px; }
        .log-date { font-size: 12px; color: var(--accent-color); font-weight: bold; }
        .log-desc { font-size: 15px; line-height: 1.4; }

        .delete-btn {
            background: transparent; border: none; color: #ff4d4d; font-size: 18px;
            cursor: pointer; padding: 4px; opacity: 0.6; transition: opacity 0.2s;
        }
        .delete-btn:active { opacity: 1; }

        .add-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.02);
            padding: 18px; border-radius: 16px; display: flex; flex-direction: column; gap: 14px;
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 13px; color: var(--text-muted); }
        .form-input {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255, 255, 255, 0.08); 
            color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 15px; outline: none;
        }
        .form-input:focus { border-color: var(--accent-color); }
        textarea.form-input { resize: none; height: 70px; font-family: inherit; }

        .save-btn {
            background: var(--accent-color); color: #000; border: none; width: 100%;
            padding: 14px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer;
            margin-top: 5px;
        }
        .save-btn:active { transform: scale(0.98); }

        .empty-state { text-align: center; color: var(--text-muted); margin: 40px 0; font-size: 14px; }

        /* Навигационная панель */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
            background: #111218; border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; justify-content: space-around; align-items: center; z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); text-decoration: none; font-size: 11px; gap: 4px; flex: 1; height: 100%;
        }
        .nav-item.active { color: var(--accent-color); font-weight: bold; }
        .nav-item svg { width: 22px; height: 22px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Подкормки</h1>
        <div class="stats-badge">Записей: {{ processes_count }}</div>
    </div>

    <div class="section-title">История подкормок</div>

    <div class="log-container">
        {% for log in podkormka_log %}
        <div class="log-card">
            <div class="log-details">
                <span class="log-date" data-date="{{ log.date }}">Загрузка...</span>
                <p class="log-desc">{{ log.description }}</p>
            </div>
            <button class="delete-btn" onclick="deleteKorm('{{ log.id }}')">✕</button>
        </div>
        {% else %}
        <div class="empty-state">Записей о подкормках пока нет.</div>
        {% endfor %}
    </div>

    <div class="section-title">Добавить подкормку</div>
    <div class="add-card">
        <div class="form-group">
            <label class="form-label">Дата подкормки</label>
            <input type="date" id="kormDate" class="form-input">
        </div>
        <div class="form-group">
            <label class="form-label">Какое удобрение внесли</label>
            <textarea id="kormDesc" class="form-input" placeholder="Например: Внесли древесную золу под кусты сорта Аркадия..."></textarea>
        </div>
        <button class="save-btn" onclick="addKorm()">Добавить запись</button>
    </div>

    <!-- Панель навигации -->
    <div class="bottom-nav">
        <a href="/user/{{ telegram_id }}" class="nav-item">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            Виноградник
        </a>
        <a href="/user/{{ telegram_id }}/process" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Обработки
        </a>
        <a href="/user/{{ telegram_id }}/podkormka" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
            Подкормки
        </a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        document.getElementById('kormDate').value = new Date().toISOString().split('T')[0];

        document.querySelectorAll('.log-date').forEach(el => {
            const raw = el.getAttribute('data-date');
            if (raw) {
                const d = new Date(raw.replace(' ', 'T'));
                if (!isNaN(d)) {
                    el.innerText = d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'long', year: 'numeric' });
                }
            }
        });

        // Добавление записи о подкормке
        async function addKorm() {
            const dateVal = document.getElementById('kormDate').value;
            const descVal = document.getElementById('kormDesc').value.trim();

            if (!descVal) {
                tg.showAlert("Описание подкормки не может быть пустым!");
                return;
            }

            const payload = {
                date: new Date(dateVal).toISOString(),
                description: descVal
            };

            try {
                const response = await fetch(`/user/{{ telegram_id }}/podkormka/add_korm`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    tg.showAlert("Ошибка при сохранении.");
                }
            } catch (e) {
                console.error(e);
                tg.showAlert("Ошибка соединения с сервером.");
            }
        }

        // Удаление записи о подкормке
        function deleteKorm(id) {
            tg.showConfirm("Удалить эту запись из журнала подкормок?", async function(confirmed) {
                if (confirmed) {
                    try {
                        const response = await fetch(`/user/{{ telegram_id }}/podkormka/${id}`, {
                            method: 'DELETE'
                        });
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            tg.showAlert("Ошибка при удалении.");
                        }
                    } catch (e) { console.error(e); }
                }
            });
        }
    </script>
</body>
</html>
